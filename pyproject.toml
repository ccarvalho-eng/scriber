[project]
name = "scriber-books"
version = "0.2.0"
description = "Turn Markdown manuscripts into publication-ready print PDFs and EPUBs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Cristiano Carvalho" }]
keywords = ["books", "epub", "kdp", "markdown", "publishing", "typesetting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Other Audience",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "pillow>=11.0,<13",
  "pyphen>=0.17,<1",
  "pypdf>=5.0,<7",
  "reportlab>=4.2,<5",
]

[project.urls]
Homepage = "https://github.com/ccarvalho-eng/scriber"
Documentation = "https://github.com/ccarvalho-eng/scriber#readme"
Issues = "https://github.com/ccarvalho-eng/scriber/issues"
Source = "https://github.com/ccarvalho-eng/scriber"

[project.scripts]
scriber = "scriber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "coverage>=7.10,<8",
  "pyright[nodejs]>=1.1.400,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scriber"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.coverage.run]
branch = true
source = ["scriber"]

[tool.coverage.report]
fail_under = 75
show_missing = true
