[project]
name = "scriber"
version = "0.1.0"
description = "Compile multi-book Markdown projects into print-ready PDFs and EPUBs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow>=11.0,<13",
  "pypdf>=5.0,<7",
  "reportlab>=4.2,<5",
]

[project.scripts]
scriber = "scriber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/scriber"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
